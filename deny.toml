[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
# webpki-roots holds Mozilla's root certificate list, licensed CDLA-Permissive-2.0.
# Approved by Brighton on 14 Nov 2026 for this one crate only (auth T01).
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # docs/licence-rules.md permits MPL-2.0 for dependencies only.
    { allow = ["MPL-2.0"], crate = "base64urlsafedata" },
    { allow = ["MPL-2.0"], crate = "webauthn-attestation-ca" },
    { allow = ["MPL-2.0"], crate = "webauthn-rs" },
    { allow = ["MPL-2.0"], crate = "webauthn-rs-core" },
    { allow = ["MPL-2.0"], crate = "webauthn-rs-proto" },
]

[advisories]
ignore = [
    # chrono arrives transitively via oauth2 and rmcp; neither offers a
    # maintained replacement path today. RUSTSEC-2026-0543 is unmaintained-only,
    # no known vulnerability.
    "RUSTSEC-2026-0543",
]
