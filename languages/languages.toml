# Language catalogue for the judge sandbox (judge-sandbox T04, design.md section 6).
#
# Every image must be pinned by digest. A tag is refused by the loader.
# Python is pinned (judge-sandbox T03, 14 Nov 2026). Node, Temurin 21 and GCC 14
# were pinned 15 Nov 2026 (see deploy/sandbox-verification.md). All four stay
# digest-pinned. JavaScript, Java and C++ remain disabled until their drivers exist.
# Renovate (renovate.json) proposes weekly digest refreshes; a human merges them.
#
# Python and JavaScript are enabled (language-drivers T02). Java and C++ are present but disabled
# (stretch goals). The executor refuses disabled languages.
#
# Driver files are relative to this directory. The loader refuses an enabled language
# whose driver file is missing. Until language-drivers adds drivers/python/driver.py and
# drivers/javascript/driver.js, the real file fails the loader. Tests stub both files.

[python]
enabled = true
image = "python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
file = "solution.py"
driver = "drivers/python/driver.py"
compile = ["python3", "-I", "-S", "-m", "py_compile", "/box/solution.py"]
run = ["python3", "-I", "-S", "driver.py"]
bench_args = ["--mode", "bench"]
mem_mb = 256
time_ms_per_test = 2000
max_time_ms_per_test = 10000
compile_budget_ms = 5000
max_source_bytes = 65536
exec_scratch = false
protocol_version = 1

[javascript]
enabled = true
image = "node:22-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee"
file = "solution.js"
driver = "drivers/javascript/driver.js"
compile = []
run = ["node", "--max-old-space-size=192", "driver.js"]
bench_args = ["--mode", "bench"]
mem_mb = 256
time_ms_per_test = 2000
max_time_ms_per_test = 10000
compile_budget_ms = 5000
max_source_bytes = 65536
exec_scratch = false
protocol_version = 1

[java]
enabled = false
image = "eclipse-temurin:21-jdk@sha256:0a3f329821dcadf54b2a3033a15e2e9f007069a9db43d7f51897e6b80e726b07"
file = "Solution.java"
driver = "drivers/java/Driver.java"
compile = ["javac", "-d", "/box/out", "Solution.java", "Driver.java"]
run = ["java", "-Xss16m", "-Xmx256m", "-XX:+UseSerialGC", "-cp", "/box/out", "Driver"]
bench_args = ["--mode", "bench"]
mem_mb = 512
time_ms_per_test = 3000
max_time_ms_per_test = 10000
compile_budget_ms = 10000
max_source_bytes = 65536
exec_scratch = true
protocol_version = 1

[cpp]
enabled = false
image = "gcc:14@sha256:a6f425a380ee03e682df3b436fc9077c544fb0fea0a9cab943c3b8320db10765"
file = "solution.cpp"
driver = "drivers/cpp/driver.cpp"
compile = ["g++", "-O2", "-std=c++20", "-o", "/box/out/main", "driver.cpp"]
run = ["/box/out/main"]
bench_args = ["--mode", "bench"]
mem_mb = 256
time_ms_per_test = 2000
max_time_ms_per_test = 10000
compile_budget_ms = 10000
max_source_bytes = 65536
exec_scratch = true
protocol_version = 1
