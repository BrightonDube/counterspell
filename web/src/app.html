<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Route Seo owns title and description: %sveltekit.head% appends route
         tags after any static ones, so a generic title or description meta
         here would win over every route — keep them out of this shell. -->

    <link rel="icon" type="image/svg+xml" href="/landing/moon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
