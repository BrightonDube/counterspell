<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="400" height="300" role="img" aria-label="Drifting poison-green spores, transparent"><title>Drifting poison-green spores, transparent</title><style>
*{transform-box:fill-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.rise{animation:rise var(--d) linear var(--dl) infinite;opacity:var(--o0,.35);transform-origin:50% 100%}
@keyframes rise{0%{transform:translate(0,0) scale(.35,.45);opacity:0}
 18%{opacity:var(--o)}60%{opacity:calc(var(--o)*.7)}
 100%{transform:translate(var(--dx),var(--dy)) scale(var(--s),calc(var(--s)*1.15));opacity:0}}
.drift{animation:drift var(--d) linear var(--dl) infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
.flick{animation:flick var(--d) steps(1,end) var(--dl) infinite;mix-blend-mode:screen}
@keyframes flick{0%{opacity:.85}7%{opacity:.62}13%{opacity:.95}21%{opacity:.7}29%{opacity:.9}36%{opacity:.55}44%{opacity:1}52%{opacity:.74}61%{opacity:.88}69%{opacity:.6}77%{opacity:.97}86%{opacity:.7}93%{opacity:.9}}
.pulse{animation:pulse var(--d) ease-in-out var(--dl) infinite;mix-blend-mode:screen;transform-origin:50% 50%}
@keyframes pulse{0%,100%{opacity:var(--lo,.35);transform:scale(.92)}50%{opacity:var(--hi,1);transform:scale(1.08)}}
.flash{animation:flash var(--d) linear var(--dl) infinite;opacity:0}
@keyframes flash{0%,78%{opacity:0}79%{opacity:var(--o,1)}80.5%{opacity:.15}82%{opacity:var(--o,1)}84%{opacity:.4}87%,100%{opacity:0}}
.float{animation:float var(--d) ease-in-out var(--dl) infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--fx,0px),var(--fy,-14px))}}
.breathe{animation:breathe var(--d) ease-in-out var(--dl) infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(var(--bs,1.015))}}
.zoom{animation:zoom var(--d) ease-in-out infinite;transform-origin:50% 50%}
@keyframes zoom{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.flap{animation:flap var(--d) ease-in-out var(--dl) infinite;transform-origin:50% 40%}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.42)}}
.swing{animation:swing var(--d) ease-in-out var(--dl) infinite}
@keyframes swing{0%,100%{transform:rotate(var(--a,3deg))}50%{transform:rotate(calc(var(--a,3deg)*-1))}}
.spin{animation:spin var(--d) linear var(--dl) infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.glint{animation:glint var(--d) ease-in-out var(--dl) infinite}
@keyframes glint{0%,55%{transform:translateX(-1200px)}85%,100%{transform:translateX(1200px)}}
.jitter{animation:jitter var(--d) steps(1,end) var(--dl) infinite}
@keyframes jitter{0%,100%{transform:translate(0,0)}20%{transform:translate(1px,-1px)}40%{transform:translate(-1px,1px)}60%{transform:translate(1px,1px)}80%{transform:translate(-1px,0)}}
.blink{animation:blink var(--d) linear var(--dl) infinite;transform-origin:50% 50%}
@keyframes blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.05)}}
