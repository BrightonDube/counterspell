<?xml version="1.0" encoding="UTF-8"?>
<!--
  Counterspell "Steel Night" piece set — original 2.5D vector artwork.
  Twelve 40px-tile glyphs plus the promotion crown, matching the
  cm-chessboard sprite contract (<g id=".."> in one shared 40x40 frame).
  Vocabulary per piece: soft shadow ellipse (.sh), outlined silhouette
  (group stroke), and a candle-lit rim highlight (.hi). Bone for White,
  night-violet for Black — both read on the moss-green board.
-->
