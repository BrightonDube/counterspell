<?xml version="1.0" encoding="UTF-8"?>
<!--
  Counterspell "Steel Night" piece set — original 2.5D vector artwork.
  Twelve 40px-tile glyphs plus the promotion crown, matching the
  cm-chessboard sprite contract (<g id=".."> in one shared 40x40 frame).
  Vocabulary per piece: soft shadow ellipse (.sh), outlined silhouette
  (group stroke), dimensional gradient body, and a rim highlight (.hi).
  White is carved ivory with restrained candle-gold accents; Black is
  obsidian edged in bright steel so it reads on the dark squares.
-->
<svg width="40px" height="40px" viewBox="0 0 40 40" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>Steel Night chess pieces sprite</title>
  <desc>Original chess pieces: carved ivory with candle-gold accents for White, steel-edged obsidian for Black.</desc>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5e8"/>
      <stop offset="0.55" stop-color="#ece2cb"/>
      <stop offset="1" stop-color="#cbbd9e"/>
    </linearGradient>
    <linearGradient id="ivory-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7dbc0"/>
      <stop offset="1" stop-color="#b1a180"/>
    </linearGradient>
    <linearGradient id="obsidian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5464"/>
      <stop offset="0.5" stop-color="#252c39"/>
      <stop offset="1" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="obsidian-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333d4d"/>
      <stop offset="1" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2cd92"/>
      <stop offset="1" stop-color="#c79a58"/>
    </linearGradient>
  </defs>

