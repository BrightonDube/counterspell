<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="PLACEHOLDER ART">
  <!-- PLACEHOLDER ART: not the final jack-o'-lantern. Fallback only, used if the approved art
       fails to load or validate. It satisfies the id contract in
       web/src/lib/familiar/mascot/contract.ts so the mascot code can still be built and tested. -->
  <title>PLACEHOLDER ART</title>
  <defs>
    <radialGradient id="fam-glow" cx="50%" cy="50%" r="50%">
      <stop id="fam-glow-stop-inner" offset="0%" stop-color="#d9a25b"/>
      <stop id="fam-glow-stop-outer" offset="100%" stop-color="#080d0e"/>
    </radialGradient>
  </defs>
  <g id="fam-body">
    <ellipse cx="100" cy="105" rx="80" ry="70" fill="url(#fam-glow)" stroke="#33494f"/>
    <g id="fam-mood-1" opacity="0"><text x="100" y="110" text-anchor="middle" font-size="12" fill="#e6e1d3">1</text></g>
    <g id="fam-mood-2" opacity="0"><text x="100" y="110" text-anchor="middle" font-size="12" fill="#e6e1d3">2</text></g>
    <g id="fam-mood-3" opacity="0"><text x="100" y="110" text-anchor="middle" font-size="12" fill="#e6e1d3">3</text></g>
    <g id="fam-mood-4" opacity="0"><text x="100" y="110" text-anchor="middle" font-size="12" fill="#e6e1d3">4</text></g>
    <g id="fam-mood-5" opacity="0"><text x="100" y="110" text-anchor="middle" font-size="12" fill="#e6e1d3">5</text></g>
  </g>
  <g id="fam-fx"></g>
  <text x="100" y="192" text-anchor="middle" font-size="10" fill="#e6e1d3">PLACEHOLDER ART</text>
</svg>
