# Deploy to the production VPS.
#
# Routine deploys: a push to main that finishes a green CI run (which also publishes the signed
# images) triggers this workflow through workflow_run. Manual deploys: Actions > Deploy > Run
# workflow, optionally with the full SHA of a green main commit.
#
# Setup (one-time, see deploy/vps/README.md):
#   1. Settings > Environments > "production": deployment branches = main (+ tags v*).
#   2. Environment secrets: DEPLOY_HOST, DEPLOY_PORT, DEPLOY_SSH_KEY (forced-command key),
#      DEPLOY_KNOWN_HOSTS (host key copied out-of-band, not ssh-keyscan).
#   3. Repository variable DEPLOY_ENABLED = true as the master switch.
# The runner never gets a shell on the server: the key can only run counterspell-deploy as
# deploy-counterspell, which accepts one strictly validated "deploy <sha> <digest> <digest>
# <digest>" line. On failure the script itself restores the previous release; a failed
# post-deploy health check additionally runs `rollback` to keep the previous tag live.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA whose published images to deploy (default = this run's commit)
        required: false
        default: ""

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy halfway

env:
  HEALTH_URL: https://counterspell.online/api/health

jobs:
  disabled:
    name: Deploy disabled (setup pending)
    if: vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Explain
        run: |
          echo "::notice title=Deploy disabled::Set DEPLOY_ENABLED=true to enable deploys (see the header of deploy.yml)."
          echo "Deploy is disabled until DEPLOY_ENABLED=true. Nothing was deployed." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve and validate the commit
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          sha="${INPUT_SHA:-$RUN_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Not a full commit SHA"; exit 1; }
          echo "value=$sha" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Log in to GHCR (read-only)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify signatures and pin digests
        id: digests
        env:
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          identity="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/publish-images\.yml@refs/(heads/main|tags/v.+)$"
          for img in server judge migrate; do
            ref="ghcr.io/${owner}/counterspell-${img}:sha-${SHA}"
            cosign verify "$ref" --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Bad digest for $ref"; exit 1; }
            echo "${img}=${digest}" >> "$GITHUB_OUTPUT"
          done
      - name: Deploy over SSH (pinned host key, forced command)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SHA: ${{ steps.sha.outputs.value }}
          D_SERVER: ${{ steps.digests.outputs.server }}
          D_JUDGE: ${{ steps.digests.outputs.judge }}
          D_MIGRATE: ${{ steps.digests.outputs.migrate }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/deploy_key"; kh="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$kh"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$kh"
          # The deploy script restores the previous release itself when a check fails, so a
          # non-zero exit here means the server is already back on the old tag.
          ssh -i "$key" -p "${PORT:-22}" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$kh" \
            "deploy-counterspell@${HOST}" "deploy ${SHA} ${D_SERVER} ${D_JUDGE} ${D_MIGRATE}"
      - name: Public health check
        id: health
        env:
          HEALTH_URL: ${{ env.HEALTH_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            body="$(curl -fsS --max-time 5 "$HEALTH_URL" || true)"
            if [[ "$body" == *'"ok"'* ]]; then
              echo "health: $body"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public health check did not return ok after the deploy."
          exit 1
      - name: Roll back to the previous release on a failed health check
        if: steps.health.outcome == 'failure'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/deploy_key"; kh="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$kh"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$kh"
          ssh -i "$key" -p "${PORT:-22}" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$kh" \
            "deploy-counterspell@${HOST}" "rollback"
      - name: Fail the run after rollback
        if: steps.health.outcome == 'failure'
        run: exit 1
      - name: Summary
        env:
          SHA: ${{ steps.sha.outputs.value }}
        run: echo "Deployed \`${SHA}\` (signature-verified images, pinned by digest)." >> "$GITHUB_STEP_SUMMARY"
