# Reusable: build, push, sign and attest the three runtime images to GHCR.
# Called only by ci.yml after "CI OK" on pushes to the default branch or v* tags.
# Verify an image:  gh attestation verify oci://ghcr.io/brightondube/counterspell-server:sha-<sha> -R BrightonDube/counterspell
#                   cosign verify ghcr.io/brightondube/counterspell-server:sha-<sha> \
#                     --certificate-identity-regexp '^https://github.com/BrightonDube/counterspell/\.github/workflows/publish-images\.yml@refs/(heads/brighton/kiro-setup|tags/v.+)$' \
#                     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Publish images

on:
  workflow_call:

permissions: {}

jobs:
  image:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR with the short-lived GITHUB_TOKEN (no PAT)
      id-token: write # keyless cosign + artifact attestations via Sigstore
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: counterspell-server
            target: server-runtime
          - image: counterspell-judge
            target: judge-runtime
          - image: counterspell-migrate
            target: migration-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (GHCR needs lowercase)
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=counterspell
          cache-to: type=gha,scope=counterspell,mode=max
      - name: Sign image (cosign keyless)
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REF}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.name.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.image }}.spdx.json
          push-to-registry: true
      - name: Keep SBOM for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}.spdx.json
          retention-days: 30
      - name: Summary
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Published \`${REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest \`${DIGEST}\`, signed (cosign keyless), provenance and SBOM attested." >> "$GITHUB_STEP_SUMMARY"
