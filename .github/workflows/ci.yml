# CI: build, lint and test everything on every PR and on the default branch.
# Pushes to the default branch (and v* tags) then publish signed images via publish-images.yml.
# Required check for the ruleset: "CI OK" (aggregates every job below, skipped jobs count as pass).
name: CI

on:
  push:
    branches: [brighton/kiro-setup]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a default-branch/tag run: it may be publishing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
    steps:
      - name: Filter paths (PRs only; pushes run everything)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
              - .github/actions/**
            rust:
              - *ci
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - deny.toml
              - migrations/**
              - packs/**
              - languages/**
            web:
              - *ci
              - web/**
            docker:
              - *ci
              - Dockerfile
              - .dockerignore
              - docker-compose.yml
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - web/**
              - migrations/**

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services: &services
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_USER: counterspell
          POSTGRES_PASSWORD: counterspell-ci-only
          POSTGRES_DB: counterspell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U counterspell -d counterspell_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Throwaway CI-only service containers; not a real credential.
      DATABASE_URL: postgres://counterspell:counterspell-ci-only@localhost:5432/counterspell_test
      VALKEY_URL: redis://localhost:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          cache-key: debug
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test (fails if no tests ran)
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked 2>&1 | tee "$RUNNER_TEMP/test.log"
          passed=$(grep -oE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test.log" | awk '{s+=$4} END{print s+0}')
          ignored=$(grep -oE '[0-9]+ ignored' "$RUNNER_TEMP/test.log" | awk '{s+=$1} END{print s+0}')
          {
            echo "### Rust tests"
            echo "| Passed | Ignored |"
            echo "|---:|---:|"
            echo "| $passed | $ignored |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -eq 0 ]; then echo "::error::No Rust tests ran. TDD: every change ships with tests."; exit 1; fi

  coverage:
    name: Rust coverage (cargo-llvm-cov)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services: *services
    env:
      DATABASE_URL: postgres://counterspell:counterspell-ci-only@localhost:5432/counterspell_test
      VALKEY_URL: redis://localhost:6379
      # Raise once a baseline is agreed: repo variable COVERAGE_MIN_LINES (percent).
      COVERAGE_MIN_LINES: ${{ vars.COVERAGE_MIN_LINES || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          cache-key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info --fail-under-lines "$COVERAGE_MIN_LINES"
      - name: Coverage summary
        run: |
          {
            echo "### Rust coverage"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-lcov
          path: lcov.info
          retention-days: 14

  web:
    name: Web (check, lint, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up web
        uses: ./.github/actions/setup-web
      - name: svelte-check
        run: npm run check
      - name: Lint
        run: |
          if npm pkg get scripts.lint | grep -q '{}'; then
            echo "::warning title=No web lint::web/package.json has no \"lint\" script yet; add ESLint/Prettier to enforce it."
          else
            npm run lint
          fi
      - name: Unit tests (Vitest)
        run: |
          if npm pkg get scripts.test | grep -q '{}'; then
            echo "::warning title=No web tests::web/package.json has no \"test\" script yet; add Vitest so the TDD gate covers the frontend."
            echo "> :warning: **web:** no \`test\` script yet, frontend unit tests are not enforced." >> "$GITHUB_STEP_SUMMARY"
          else
            npm run test -- --run
          fi
      - name: Build
        run: npm run build

  docker:
    name: Docker build (no push)
    needs: changes
    # Pushes to the default branch/tags build in publish-images.yml instead.
    if: needs.changes.outputs.docker == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server-runtime
          push: false
          cache-from: type=gha,scope=counterspell
          cache-to: type=gha,scope=counterspell-pr-${{ github.event.pull_request.number || 'manual' }},mode=max
      - name: Build judge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: judge-runtime
          push: false
          cache-from: type=gha,scope=counterspell
      - name: Build migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migration-runtime
          push: false
          cache-from: type=gha,scope=counterspell

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, rust, coverage, web, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All CI jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A CI job ended with '$r'"; exit 1 ;; esac
          done

  publish:
    name: Publish
    needs: ci-ok
    if: github.event_name == 'push' && needs.ci-ok.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-images.yml

  release:
    name: GitHub release (tags)
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true
      - name: Create release with SBOMs attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes sbom/*
