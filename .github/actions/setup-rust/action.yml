name: Set up Rust
description: Stable Rust toolchain plus a Cargo cache that only the default branch may write.
inputs:
  components:
    description: Comma-separated rustup components (e.g. "rustfmt, clippy").
    required: false
    default: ""
  cache-key:
    description: Shared cache key so jobs with the same build profile reuse target/.
    required: false
    default: default
runs:
  using: composite
  steps:
    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        components: ${{ inputs.components }}
    - name: Restore Cargo cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        # Only trusted pushes to main (the production/default branch) write the cache; PRs and kiro-setup only read it.
        save-if: ${{ github.ref == 'refs/heads/main' }}
