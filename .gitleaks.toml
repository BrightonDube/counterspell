# Gitleaks config: the full default ruleset plus narrow allowlists.
# Only allowlist test fixtures with obviously fake values; never allowlist real config.
title = "counterspell"

[extend]
useDefault = true

[[allowlists]]
description = "Generated/vendor files and Kiro run logs metadata that cannot hold secrets"
paths = [
  '''(^|/)Cargo\.lock$''',
  '''(^|/)package-lock\.json$''',
]

[[allowlists]]
description = "Obviously fake fixtures in tests (value must contain 'fake', 'dummy', 'example' or 'test')"
condition = "AND"
paths = ['''(^|/)(tests?|fixtures|__tests__)/''']
regexTarget = "match"
regexes = ['''(?i)(fake|dummy|example|placeholder|test)''']
