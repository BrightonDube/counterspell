services:
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      server:
        condition: service_started
    networks:
      - edge
      - internal
    restart: unless-stopped

  server:
    build:
      context: .
      target: server-runtime
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      STATIC_DIR: /app/web/build
      # Login role counterspell_server. The value comes from the host environment, never from this file.
      DATABASE_URL: ${SERVER_DATABASE_URL:-}
      # Valkey has no auth and sits only on the internal network, so the in-network address is the default.
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      # Hints (hints spec H16). AI stays off unless HINT_PROVIDERS names a provider and its key is set.
      # Keys come from the host environment at deploy time. Empty values count as not set.
      HINT_PROVIDERS: ${HINT_PROVIDERS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_STRICT_CONFIG: ${AI_STRICT_CONFIG:-true}
      # Auth settings (R2). Each value comes from the host environment and is passed through here.
      # Empty values count as not set. Only the server receives them; the judge never does.
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      EMAIL_DAILY_CAP: ${EMAIL_DAILY_CAP:-}
      DEMO_ACCOUNT_EMAIL: ${DEMO_ACCOUNT_EMAIL:-}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-}
      DEMO_RESET_HOUR_UTC: ${DEMO_RESET_HOUR_UTC:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - edge
      - internal
    restart: unless-stopped

  judge:
    build:
      context: .
      target: judge-runtime
    environment:
      # Login role counterspell_judge. The value comes from the host environment, never from this file.
      DATABASE_URL: ${JUDGE_DATABASE_URL:-}
      JUDGE_CONCURRENCY: "2"
      LEASE_SECS: "30"
      RENEW_SECS: "10"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: counterspell
      POSTGRES_DB: counterspell
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterspell -d counterspell"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  valkey:
    image: valkey/valkey:9-alpine
    # Append-only file on, so a restart keeps the daily hint counters (hints spec open question 6).
    command: ["valkey-server", "--save", "", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  migrate:
    build:
      context: .
      target: migration-runtime
    environment:
      DATABASE_URL: postgres://counterspell@postgres:5432/counterspell
    command: ["migrate", "run", "--source", "/app/migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  pgdata:

networks:
  edge:
  internal:
    internal: true
