services:
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      server:
        condition: service_started
    networks:
      - edge
      - internal
    restart: unless-stopped

  server:
    build:
      context: .
      target: server-runtime
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      STATIC_DIR: /app/web/build
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - edge
      - internal
    restart: unless-stopped

  judge:
    build:
      context: .
      target: judge-runtime
    environment:
      DATABASE_URL: postgres://counterspell@postgres:5432/counterspell
      JUDGE_CONCURRENCY: "2"
      LEASE_SECS: "30"
      RENEW_SECS: "10"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: counterspell
      POSTGRES_DB: counterspell
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterspell -d counterspell"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  migrate:
    build:
      context: .
      target: migration-runtime
    environment:
      DATABASE_URL: postgres://counterspell@postgres:5432/counterspell
    command: ["migrate", "run", "--source", "/app/migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  pgdata:

networks:
  edge:
  internal:
    internal: true
