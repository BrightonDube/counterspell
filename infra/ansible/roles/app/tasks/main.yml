---
# App directories, host values, deploy scripts and the compose checksum record (deploy-ops R5.1,
# R5.4, R7.13). Secrets are never written here: Brighton writes the env files by hand (T27).
# Ownership comes from app_owner: root on a dedicated host, the deploy user on the shared host.

- name: Refuse to run without the public site address
  ansible.builtin.assert:
    that:
      - caddy_site_address | length > 0
    fail_msg: "Set caddy_site_address in inventory/group_vars/all.yml (the public hostname, no secrets)."
    quiet: true

- name: Create the app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0750"

- name: Create the env directory (owner only)
  ansible.builtin.file:
    path: "{{ app_env_dir }}"
    state: directory
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0700"

- name: Create the script directory when it lives under the app directory
  ansible.builtin.file:
    path: "{{ app_bin_dir }}"
    state: directory
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0750"
  when: app_bin_dir is match(app_dir)

- name: Write the non-secret host values (R5.4)
  ansible.builtin.template:
    src: host.env.j2
    dest: "{{ app_host_env }}"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0644"

- name: Check that Brighton has written each service env file with mode 0600 (R5.1)
  ansible.builtin.stat:
    path: "{{ app_env_dir }}/{{ item }}.env"
  loop: "{{ app_env_services }}"
  register: app_env_stat
  tags: [env-check]

- name: Stop until every service env file exists, is owned by the app owner and is mode 0600
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.mode == '0600'
      - item.stat.pw_name == app_owner
    fail_msg: >-
      Missing or wrongly permissioned {{ app_env_dir }}/{{ item.item }}.env. Write it by hand, owned by
      {{ app_owner }} with mode 0600 (T27).
    quiet: true
  loop: "{{ app_env_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [env-check]

- name: Copy the compose files and write the checksum record
  ansible.builtin.include_tasks: compose_sha.yml

- name: Install the deploy scripts (mode 0755)
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item.src }}"
    dest: "{{ app_bin_dir }}/{{ item.dest }}"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop: "{{ app_scripts }}"
