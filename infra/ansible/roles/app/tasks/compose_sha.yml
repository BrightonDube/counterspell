---
# Copies the production compose and Caddy files, then records their SHA-256 values (R7.13, Q19).
# counterspell-deploy refuses to pull when a file no longer matches this record.

- name: Copy the compose and Caddy files to the app directory
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item.src }}"
    dest: "{{ app_dir }}/{{ item.dest }}"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0644"
  loop: "{{ app_compose_files }}"

- name: Read the SHA-256 of each copied file
  ansible.builtin.stat:
    path: "{{ app_dir }}/{{ item.dest }}"
    checksum_algorithm: sha256
    get_checksum: true
  loop: "{{ app_compose_files }}"
  register: app_compose_stat

- name: Write compose.sha256
  ansible.builtin.template:
    src: compose.sha256.j2
    dest: "{{ app_dir }}/compose.sha256"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0644"
