# Defaults for the caddy_site role. The shared Caddy bind-mounts ONE file (/opt/proxy/compose/Caddyfile),
# so the change is a marked block appended to that file, in place. Values confirmed by a read-only look at
# the host on 16 Nov 2026.
caddy_site_caddyfile: /opt/proxy/compose/Caddyfile
caddy_site_container: proxy-caddy-1
caddy_site_container_caddyfile: /etc/caddy/Caddyfile

# The Counterspell server container, reachable by name over the existing counterspell_edge network,
# which the shared Caddy is already attached to.
caddy_site_upstream: counterspell-server:8080

# The other tenant's health URL must answer the same before and after the reload.
caddy_site_health_url: https://api.evorayn.com/health

caddy_site_env:
  CADDY_FILE: "{{ caddy_site_caddyfile }}"
  CADDY_CONTAINER: "{{ caddy_site_container }}"
  CADDY_CONTAINER_FILE: "{{ caddy_site_container_caddyfile }}"
  HEALTH_URL: "{{ caddy_site_health_url }}"
  CADDY_BLOCK: "{{ lookup('ansible.builtin.template', 'counterspell.caddy.j2') }}"
