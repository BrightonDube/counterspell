---
# Adds one marked Counterspell block to the shared Caddyfile, validates, and reloads the running Caddy.
# The work is done by files/counterspell-caddy-site (bats-tested): in place, same inode, backup first,
# validate then reload (never restart), restore on any failure. Existing lines are never touched.
# ansible.builtin.script copies the script, runs it and leaves nothing on the host.

- name: Refuse to run without the public site address
  ansible.builtin.assert:
    that:
      - caddy_site_address | length > 0
    fail_msg: "Set caddy_site_address for this host in the inventory."
    quiet: true

- name: Plan the Caddy change (read-only, also runs in check mode)
  ansible.builtin.script: "counterspell-caddy-site plan"
  environment: "{{ caddy_site_env }}"
  check_mode: false
  changed_when: "'unchanged' not in caddy_site_plan.stdout"
  register: caddy_site_plan

- name: Show the Caddy plan
  ansible.builtin.debug:
    msg: "{{ caddy_site_plan.stdout_lines }}"

- name: Add or update the Counterspell block, validate and reload (never restart)
  ansible.builtin.script: "counterspell-caddy-site add"
  environment: "{{ caddy_site_env }}"
  when: "'unchanged' not in caddy_site_plan.stdout"
  register: caddy_site_apply
  changed_when: true
