# Defaults for the sandbox role: the rootless Docker daemon that runs user code, and nothing else.
sandbox_runtime_dir: "/run/user/{{ sandbox_uid }}"
sandbox_socket: "/run/user/{{ sandbox_uid }}/docker.sock"
sandbox_home: "/home/{{ sandbox_user }}"
sandbox_subid_range: "100000:65536"

# Aggregate limits for the sandbox user's services (R3.3, design Q13).
sandbox_memory_max: 4G
sandbox_tasks_max: 512
sandbox_cpu_quota: "300%"

# The dependency on the cgroup controllers that must be delegated before any pull (R3.2).
sandbox_required_controllers:
  - cpu
  - cpuset
  - io
  - memory
  - pids

# Package versions follow the docker role's pins (docker_ce_version).
sandbox_packages:
  - uidmap
  - dbus-user-session
  - acl
  - slirp4netns
  # Ships /etc/apparmor.d/rootlesskit, the scoped profile that lets rootlesskit create user
  # namespaces while kernel.apparmor_restrict_unprivileged_userns stays at 1 (R3.8, Q12).
  - apparmor

# Pin docker-ce-rootless-extras to docker_ce_version on a dedicated host. On a shared host the installed
# Docker packages are left alone (a pin could downgrade the main daemon that other tenants run on).
sandbox_pin_rootless_extras: true

# Read by the pre-pull. Lives in the app directory (owned by the deploy user on a shared host), as data only.
sandbox_languages_toml: /opt/counterspell/languages.toml

# Login shell of the sandbox account. Ansible's become_user works with nologin too.
sandbox_shell: /bin/bash
