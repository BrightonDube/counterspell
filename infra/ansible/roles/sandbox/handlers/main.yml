---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload the sandbox user's systemd
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ sandbox_runtime_dir }}"
