---
# Rootless Docker daemon for sandboxes only (deploy-ops R3.1 to R3.8). The main daemon never runs user
# code and the sandbox daemon never holds application secrets.

- name: Create the sandbox account with a fixed UID, locked, no keys (the base role does this on a dedicated host)
  ansible.builtin.user:
    name: "{{ sandbox_user }}"
    uid: "{{ sandbox_uid }}"
    shell: "{{ sandbox_shell }}"
    password: "!"
    create_home: true

- name: Look up the sandbox account
  ansible.builtin.getent:
    database: passwd
    key: "{{ sandbox_user }}"

- name: Refuse a sandbox user with an unexpected UID
  ansible.builtin.assert:
    that:
      - getent_passwd[sandbox_user][1] == (sandbox_uid | string)
    fail_msg: "The {{ sandbox_user }} account must have UID {{ sandbox_uid }} (judge ACL and paths depend on it)."
    quiet: true

- name: Install the rootless Docker and sandbox prerequisites
  ansible.builtin.apt:
    name: >-
      {{ sandbox_packages + ['docker-ce-rootless-extras=' ~ docker_ce_version
         if sandbox_pin_rootless_extras | bool else 'docker-ce-rootless-extras'] }}
    state: present

- name: Give the sandbox user subordinate UID and GID ranges (rootless needs them)
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ sandbox_user }}:"
    line: "{{ sandbox_user }}:{{ sandbox_subid_range }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Enable lingering for the sandbox user so its daemon runs without a login (R3.5)
  ansible.builtin.file:
    path: "/var/lib/systemd/linger/{{ sandbox_user }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Create the drop-in directories for the sandbox user's manager and limits
  ansible.builtin.file:
    path: "/etc/systemd/system/user@{{ sandbox_uid }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Delegate the cgroup controllers to the sandbox user (R3.2)
  ansible.builtin.template:
    src: delegate.conf.j2
    dest: "/etc/systemd/system/user@{{ sandbox_uid }}.service.d/delegate.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Cap the sandbox user's aggregate CPU, memory and tasks (R3.3)
  ansible.builtin.template:
    src: limits.conf.j2
    dest: "/etc/systemd/system/user@{{ sandbox_uid }}.service.d/limits.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Start the sandbox user's manager so its controllers can be checked
  ansible.builtin.systemd:
    name: "user@{{ sandbox_uid }}.service"
    state: started
    daemon_reload: true

- name: Read the controllers delegated to the sandbox user's manager
  ansible.builtin.slurp:
    src: "/sys/fs/cgroup/user.slice/user-{{ sandbox_uid }}.slice/user@{{ sandbox_uid }}.service/cgroup.controllers"
  register: sandbox_controllers

- name: Stop unless every required controller is delegated before any pull (R3.2)
  ansible.builtin.assert:
    that:
      - item in (sandbox_controllers.content | b64decode).split()
    fail_msg: "Controller {{ item }} is not delegated to user@{{ sandbox_uid }}. Check delegate.conf and reboot if needed."
    quiet: true
  loop: "{{ sandbox_required_controllers }}"

- name: Check that the scoped rootlesskit AppArmor profile is installed (R3.8, Q12)
  # The apparmor package ships /etc/apparmor.d/rootlesskit for /usr/bin/rootlesskit. It grants
  # userns creation only; the host-wide sysctl stays untouched.
  ansible.builtin.stat:
    path: /etc/apparmor.d/rootlesskit
  register: sandbox_apparmor_profile_file

- name: Stop when the rootlesskit AppArmor profile is missing
  ansible.builtin.assert:
    that:
      - sandbox_apparmor_profile_file.stat.exists
    fail_msg: >-
      /etc/apparmor.d/rootlesskit is missing, so rootless Docker cannot create user namespaces while
      kernel.apparmor_restrict_unprivileged_userns is 1. Install the apparmor package or write the
      profile by hand (R3.8, Q12).
    quiet: true

- name: Check whether the rootlesskit AppArmor profile is already loaded
  ansible.builtin.command: grep -qw rootlesskit /sys/kernel/security/apparmor/profiles
  register: sandbox_apparmor_profile_loaded
  failed_when: false
  changed_when: false

- name: Load the rootlesskit AppArmor profile so rootless Docker can start (R3.8, Q12)
  # Command tasks are skipped in check mode, so the profile load is only verified on a real run.
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/rootlesskit
  when: not ansible_check_mode and (sandbox_apparmor_profile_loaded.rc | default(1)) != 0
  changed_when: true

- name: Check that the rootlesskit AppArmor profile stayed loaded (R3.8)
  ansible.builtin.command: grep -qw rootlesskit /sys/kernel/security/apparmor/profiles
  when: not ansible_check_mode
  changed_when: false
  failed_when: false
  register: sandbox_apparmor_profile_verify

- name: Refuse to continue when the profile did not load
  ansible.builtin.assert:
    that:
      - sandbox_apparmor_profile_verify.rc | default(0) == 0
    fail_msg: >-
      The rootlesskit AppArmor profile is not loaded, so rootless Docker cannot create user
      namespaces (R3.8). Check `aa-status` and apparmor_parser output on the host.
    quiet: true
  when: not ansible_check_mode

- name: Install the rootless Docker daemon for the sandbox user (once)
  ansible.builtin.command: dockerd-rootless-setuptool.sh install
  args:
    creates: "{{ sandbox_home }}/.config/systemd/user/docker.service"
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ sandbox_runtime_dir }}"
    PATH: "/usr/bin:/bin:/usr/sbin:/sbin"

- name: Create the drop-in directory for the sandbox daemon
  ansible.builtin.file:
    path: "{{ sandbox_home }}/.config/systemd/user/docker.service.d"
    state: directory
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0755"

- name: Reapply the judge's socket ACL after each daemon start (R3.4)
  ansible.builtin.template:
    src: acl.conf.j2
    dest: "{{ sandbox_home }}/.config/systemd/user/docker.service.d/acl.conf"
    owner: "{{ sandbox_user }}"
    group: "{{ sandbox_user }}"
    mode: "0644"
  notify: Reload the sandbox user's systemd

- name: Start the sandbox daemon as its own user service (R3.1)
  ansible.builtin.systemd:
    name: docker
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ sandbox_runtime_dir }}"

- name: Install the language catalogue (the pre-pull reads the pinned digests from it)
  ansible.builtin.copy:
    src: "{{ repo_root }}/languages/languages.toml"
    dest: "{{ sandbox_languages_toml }}"
    owner: root
    group: root
    mode: "0644"

- name: Pull each enabled sandbox image by digest and check it (R3.6, R3.7)
  # The script is copied, run and removed by Ansible, so no root-run file is left in a user-writable place.
  ansible.builtin.script: "{{ repo_root }}/deploy/vps/prepull.sh"
  environment:
    SANDBOX_DOCKER_SOCKET: "{{ sandbox_socket }}"
    LANGUAGES_TOML: "{{ sandbox_languages_toml }}"
  changed_when: false
