# Entry point for the host configuration. Run with a tag to apply one role, for example:
#   ansible-playbook -i inventory/hosts.yml site.yml --tags base --ask-become-pass
# The app role templates the service env files from the vault, so no env-check skip is needed.
- name: Configure the Counterspell host
  hosts: counterspell
  become: true
  roles:
    - role: base
      tags: [base]
    - role: docker
      tags: [docker]
    - role: app
      tags: [app]
    - role: sandbox
      tags: [sandbox]
