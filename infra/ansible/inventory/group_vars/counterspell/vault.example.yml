# Names only. vault.yml (encrypted, committed) holds the real values. To change it:
#   ansible-vault edit --vault-password-file ~/.config/counterspell/vault-pass \
#     infra/ansible/inventory/group_vars/counterspell/vault.yml
# The password file lives outside the repository. Pass the same flag to ansible-playbook.
# The app role templates the four service env files from these names. The database passwords are
# generated once with Ansible's `password` lookup and stored here; never type them by hand.
# Email sign-in is retired: the server offers OAuth, passkeys and the demo account only.
vault_postgres_password:
vault_cs_server_password:
vault_cs_judge_password:
vault_github_oauth_client_id:
vault_github_oauth_client_secret:
vault_google_oauth_client_id:
vault_google_oauth_client_secret:
vault_session_secret:
# Optional, only when email sign-in is wanted later:
# vault_resend_api_key:
