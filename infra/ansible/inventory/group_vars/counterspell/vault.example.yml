# Names only. Copy to vault.yml, fill the values, then encrypt it:
#   ansible-vault encrypt --vault-password-file ~/.config/counterspell/vault-pass \
#     infra/ansible/inventory/group_vars/counterspell/vault.yml
# The password file lives outside the repository. Only the encrypted vault.yml is committed.
# Keys match the env names in deploy/vps/tests/fixtures/*.env.example (checked at plan time).
vault_postgres_password: CHANGE_ME
vault_session_secret: CHANGE_ME
vault_github_oauth_client_secret: CHANGE_ME
vault_google_oauth_client_secret: CHANGE_ME
vault_resend_api_key: CHANGE_ME
