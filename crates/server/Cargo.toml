[package]
name = "counterspell-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Test helpers: bearer-token test identity, in-memory problem lookup and in-memory rate limiter. Off in release builds.
testkit = []

[dependencies]
axum = "0.8.7"
counterspell-common = { path = "../common" }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "script"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6.6", features = ["fs", "limit", "set-header"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = { version = "1.9", default-features = false, features = ["std"] }
# Tests run the real queue code through the judge's test kit, without Docker support.
counterspell-judge = { path = "../judge", default-features = false, features = ["testkit"] }
# The server's own tests always see its test seams. Release builds leave the feature off.
counterspell-server = { path = ".", features = ["testkit"] }

[lints]
workspace = true
