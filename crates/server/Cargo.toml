[package]
name = "counterspell-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[features]
# Test helpers: bearer-token test identity, in-memory problem lookup and in-memory rate limiter. Off in release builds.
testkit = []

[dependencies]
axum = "0.8.7"
counterspell-common = { path = "../common" }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "script"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros", "time"] }
thiserror = "2"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "set-header"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
# Approved by Brighton (14 Nov 2026) for the SSE run stream: `unfold` builds the event stream.
fsrs = "7.0.0"
futures-util = "0.3.34"
argon2 = "0.5.3"
hmac = "0.12.1"
rand = "0.9.5"
base64 = "0.23.1"
hex = "0.4.3"
subtle = "2.6.1"
url = "2.5.8"
percent-encoding = "2.3.2"
async-trait = "0.1.92"
time = "0.3.44"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "rustls-tls"] }
ring = "0.17"
data-encoding = "2.9"
webauthn-rs = { version = "=0.5.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }
webauthn-rs-proto = "=0.5.5"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"

[dev-dependencies]
proptest = { version = "1.9", default-features = false, features = ["std"] }
# Tests run the real queue code through the judge's test kit, without Docker support.
counterspell-judge = { path = "../judge", default-features = false, features = ["testkit"] }
# The server's own tests always see its test seams. Release builds leave the feature off.
counterspell-server = { path = ".", features = ["testkit"] }
wiremock = "0.6.5"
# Test-only HTTP/1 client that reads the SSE stream from a real socket (run-lifecycle T31).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[lints]
workspace = true
