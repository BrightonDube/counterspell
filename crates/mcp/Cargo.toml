[package]
name = "counterspell-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
# rmcp 3.x needs Rust 1.88 (see docs/kiro-log/counterspell-mcp-power-decisions.md).
rust-version = "1.88"

[dependencies]
counterspell-engine = { path = "../engine" }
counterspell-grimoire = { path = "../grimoire" }
# Reused for the sandbox socket guard, so the main-daemon refusal lives in one place.
counterspell-judge = { path = "../judge", features = ["sandbox"] }
rmcp = { version = "3.10.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "io-std", "signal"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
