slug = "ember-diameter"
title = "The Ember Diameter"
status = "published"
difficulty = "hard"
track = "arrays"
concepts = ["trees", "recursion", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "tree_diameter"
returns = "int"
comparator = "exact"
complexity_note = "O(n) post-order walk and O(n) space."

[[params]]
name = "vals"
type = "list[int]"
[[params]]
name = "left"
type = "list[int]"
[[params]]
name = "right"
type = "list[int]"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 0, max_len = 40, min = -999, max = 999 }, { type = "int_array", min_len = 0, max_len = 40, min = -1, max = 39 }, { type = "int_array", min_len = 0, max_len = 40, min = -1, max = 39 },
]

[[samples]]
input = [[1, 2, 3, 4, 5], [1, 3, -1, -1, -1], [2, 4, -1, -1, -1]]
expected = 3

[[samples]]
input = [[1, 2, 3, 4], [1, 2, 3, -1], [-1, -1, -1, -1]]
expected = 3

[[samples]]
input = [[], [], []]
expected = 0
