slug = "brew-pace"
title = "The Brew Pace"
status = "published"
difficulty = "medium"
track = "arrays"
concepts = ["arrays", "binary-search"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "min_pace"
returns = "int"
comparator = "exact"
complexity_note = "O(n log m) over the answer space, O(1) space."

[[params]]
name = "brews"
type = "list[int]"
[[params]]
name = "hours"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 1, max_len = 40, min = 1, max = 99 }, { type = "int", min = 1, max = 4000 },
]

[[samples]]
input = [[3, 6, 7], 9]
expected = 2

[[samples]]
input = [[1, 1, 1], 3]
expected = 1

[[samples]]
input = [[9, 9], 2]
expected = 9
