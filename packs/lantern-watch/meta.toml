slug = "lantern-watch"
title = "The Lantern Watch"
status = "published"
difficulty = "hard"
track = "matrices"
concepts = ["matrices", "greedy", "edge-cases", "counting"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "watch_points"
returns = "int"
comparator = "exact"
complexity_note = "O(n log n) earliest-end point placement."

[[params]]
name = "spans"
type = "list[list[int]]"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "matrix", min_rows = 0, max_rows = 20, min_cols = 2, max_cols = 2, min = 0, max = 100 },
]

[[samples]]
input = [[[0, 2], [1, 3]]]
expected = 1

[[samples]]
input = [[[0, 1], [2, 3]]]
expected = 2

[[samples]]
input = [[[0, 9], [1, 2], [3, 4], [5, 6], [7, 8]]]
expected = 4
