slug = "toll-count"
title = "The Toll Count"
status = "published"
difficulty = "easy"
track = "matrices"
concepts = ["graphs", "counting", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "toll_count"
returns = "int"
comparator = "exact"
complexity_note = "O(arcs) capped count."

[[params]]
name = "edges"
type = "list[list[int]]"
[[params]]
name = "weights"
