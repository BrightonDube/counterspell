[input_schema]
type = "tuple"
items = [
  { type = "matrix", min_rows = 0, max_rows = 24, min_cols = 2, max_cols = 2, min = 0, max = 8 }, { type = "int_array", min_len = 0, max_len = 24, min = 0, max = 100000 }, { type = "int", min = 0, max = 100000 },
]

[[samples]]
input = [[[0, 1], [1, 2], [2, 3]], [5, 15, 25], 10]
expected = 1

[[samples]]
input = [[[0, 1]], [10], 10]
expected = 1

[[samples]]
input = [[], [], 10]
expected = 0
