slug = "candle-compact"
title = "The Candle Compact"
status = "published"
difficulty = "easy"
track = "arrays"
concepts = ["arrays", "two-pointers", "partitioning", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "remaining_candles"
returns = "int"
comparator = "exact"
complexity_note = "The reference keeps a write spot for each surviving candle and reports where it lands. It runs in O(n) time and O(1) extra space."

[[params]]
name = "marks"
type = "list[int]"

[[params]]
name = "cursed"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 0, max_len = 40, min = 0, max = 9 },
  { type = "int", min = 0, max = 9 },
]

[[samples]]
input = [[1, 2, 1, 3], 1]
expected = 2

[[samples]]
input = [[5, 5], 5]
expected = 0

[[samples]]
input = [[1, 2, 3], 9]
expected = 3
