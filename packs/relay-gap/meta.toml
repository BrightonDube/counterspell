slug = "relay-gap"
title = "The Relay Gap"
status = "published"
difficulty = "medium"
track = "matrices"
concepts = ["matrices", "greedy", "edge-cases", "counting"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "relay_count"
returns = "int"
comparator = "exact"
complexity_note = "O(n log n) end-sorted with gap check."

[[params]]
name = "spans"
type = "list[list[int]]"
[[params]]
name = "gap"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "matrix", min_rows = 0, max_rows = 20, min_cols = 2, max_cols = 2, min = 0, max = 100 }, { type = "int", min = 0, max = 20 },
]

[[samples]]
input = [[[0, 1], [2, 3], [4, 5]], 1]
expected = 3

[[samples]]
input = [[[0, 1], [2, 3], [4, 5]], 2]
expected = 2

[[samples]]
input = [[[0, 2], [2, 4], [4, 6]], 0]
expected = 3
