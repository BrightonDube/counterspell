slug = "harbour-depths"
title = "The Harbour Depths"
status = "published"
difficulty = "medium"
track = "arrays"
concepts = ["arrays", "two-pointers", "pairs", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "deepest_water"
returns = "int"
comparator = "exact"
complexity_note = "The reference walks both ends inward, always moving the lower post, since no closer pairing of that post can do better. It runs in O(n) time and O(1) extra space."

