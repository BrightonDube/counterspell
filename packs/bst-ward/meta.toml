slug = "bst-ward"
title = "The Bough Order Ward"
status = "published"
difficulty = "medium"
track = "arrays"
concepts = ["trees", "recursion", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "bst_check"
