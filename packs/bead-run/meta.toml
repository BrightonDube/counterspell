slug = "bead-run"
title = "The Bead Run"
status = "draft"
difficulty = "easy"
track = "strings"
concepts = ["strings", "scanning", "counting", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "longest_bead"
returns = "int"
comparator = "exact"
complexity_note = "O(n) time for one pass tracking the current run and O(1) extra space."

