slug = "warm-window"
title = "The Warm Window"
status = "published"
difficulty = "easy"
track = "arrays"
concepts = ["arrays", "sliding-window", "scanning"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "warmest_window"
