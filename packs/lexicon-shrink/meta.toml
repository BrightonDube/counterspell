slug = "lexicon-shrink"
title = "The Lexicon Shrink"
status = "published"
difficulty = "medium"
track = "strings"
concepts = ["strings", "prefixes", "deduplication", "edge-cases", "tries"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "shrunk_count"
returns = "int"
comparator = "exact"
complexity_note = "O(k^2) comparisons over at most k distinct words."

[[params]]
name = "words"
type = "str"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "string", alphabet = "abcdefghijklmnopqrstuvwxyz,", min_len = 0, max_len = 40 },
]

[[samples]]
input = ["car,cart,dog"]
expected = 2

[[samples]]
input = ["a,ab,abc"]
expected = 1

[[samples]]
input = [""]
expected = 0
