slug = "tail-mark"
title = "The Tail Mark"
status = "published"
difficulty = "easy"
track = "arrays"
concepts = ["arrays", "linked-chains", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "tail_mark"
returns = "int"
comparator = "exact"
complexity_note = "O(n) walk and O(1) space."

[[params]]
name = "marks"
type = "list[int]"
[[params]]
name = "nxt"
type = "list[int]"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 0, max_len = 40, min = 0, max = 99 }, { type = "int_array", min_len = 0, max_len = 40, min = -1, max = 39 },
]

[[samples]]
input = [[5, 7, 9], [1, 2, -1]]
expected = 9

[[samples]]
input = [[], []]
expected = -1

[[samples]]
input = [[5, 9, 7], [1, -1, 0]]
expected = 9
