[[hint]]
rung = 1
text = "Ask what a pair of positions needs before you count it."

[[hint]]
rung = 2
text = "Think about the two positions as a loop over each first item, then a loop over the items after it."

[[hint]]
rung = 3
text = "```\nfor each position i\n  for each position j after i\n    count the pair if its sum matches the target\n```"

[[hint]]
rung = 4
text = "Start each inner scan after its outer position. Add to the count whenever the two values sum to the target."
