slug = "ember-index"
title = "The Ember Index"
status = "published"
difficulty = "easy"
track = "arrays"
concepts = ["arrays", "binary-search", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "find_ember"
returns = "int"
comparator = "exact"
complexity_note = "O(log n) halving the sorted rack and O(1) space."

[[params]]
name = "embers"
type = "list[int]"
[[params]]
name = "target"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 0, max_len = 40, min = -99, max = 99, sorted = true, unique = true }, { type = "int", min = -99, max = 99 },
]

[[samples]]
input = [[1, 3, 5, 7, 9], 5]
expected = 2

[[samples]]
input = [[1, 3, 5, 7], 8]
expected = -1

[[samples]]
input = [[], 3]
expected = -1
