slug = "cover-pick"
title = "The Cover Pick"
status = "published"
difficulty = "hard"
track = "arrays"
concepts = ["arrays", "bits", "greedy", "edge-cases", "ai"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "cover_pick"
returns = "int"
comparator = "exact"
complexity_note = "O(len masks) per pick, at most n useful picks."

[[params]]
