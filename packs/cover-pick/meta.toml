  { type = "int", min = 0, max = 20 }, { type = "int_array", min_len = 0, max_len = 24, min = 0, max = 1048575 },
]

[[samples]]
input = [3, [3, 6, 1]]
expected = 2

[[samples]]
input = [4, [15]]
expected = 1

[[samples]]
input = [3, [0, 0]]
expected = 0
