slug = "closest-quota"
title = "The Closest Quota"
status = "published"
difficulty = "medium"
track = "arrays"
concepts = ["arrays", "two-pointers", "pairs", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "nearest_pair"
returns = "int"
comparator = "exact"
complexity_note = "The reference weighs the two end marks and steps the end that moves the sum toward the quota. It runs in O(n) time and O(1) extra space."

[[params]]
name = "marks"
type = "list[int]"

[[params]]
name = "quota"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 0, max_len = 40, min = 0, max = 50, sorted = true },
  { type = "int", min = 0, max = 100 },
]

[[samples]]
input = [[1, 3, 5, 8], 10]
expected = 9

[[samples]]
input = [[2, 4], 9]
expected = 6

[[samples]]
input = [[7], 3]
expected = 0
