slug = "sorted-embers"
title = "The Sorted Embers"
status = "published"
difficulty = "medium"
track = "arrays"
concepts = ["arrays", "two-pointers", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "ordered_squares"
returns = "list[int]"
comparator = "exact"
complexity_note = "The reference fills the answer from the back, always taking the larger of the two end magnitudes. It runs in O(n) time and O(n) space for the returned list."

[[params]]
name = "readings"
type = "list[int]"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 0, max_len = 40, min = -9, max = 9, sorted = true },
]

[[samples]]
input = [[-3, -1, 2]]
expected = [1, 4, 9]

[[samples]]
input = [[0, 2, 4]]
expected = [0, 4, 16]

[[samples]]
input = [[-2, -1]]
expected = [1, 4]
