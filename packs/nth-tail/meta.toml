slug = "nth-tail"
title = "The Nth From The Tail"
status = "published"
difficulty = "medium"
track = "arrays"
concepts = ["arrays", "linked-chains", "two-pointers", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "nth_tail"
returns = "int"
comparator = "exact"
complexity_note = "O(n) two-walk pass and O(1) space."

[[params]]
name = "marks"
type = "list[int]"
[[params]]
name = "nxt"
type = "list[int]"
[[params]]
name = "n"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 0, max_len = 40, min = 0, max = 99 }, { type = "int_array", min_len = 0, max_len = 40, min = -1, max = 39 }, { type = "int", min = 0, max = 40 },
]

[[samples]]
input = [[5, 7, 9], [1, 2, -1], 0]
expected = 9

[[samples]]
input = [[5, 7, 9], [1, 2, -1], 2]
expected = 5

[[samples]]
input = [[5, 7, 9], [1, 2, -1], 3]
expected = -1
