slug = "twin-ledgers"
title = "Twin Ledgers"
status = "published"
difficulty = "medium"
track = "arrays"
concepts = ["arrays", "hashing", "grouping", "indexing"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "matching_totals"
returns = "int"
comparator = "exact"
complexity_note = "The reference sums each ledger into a per-key map and joins shared keys once. It runs in O(n+m) time and O(k) extra space for k keys."

[[params]]
name = "entries_a"
type = "list[list[int]]"

[[params]]
name = "entries_b"
type = "list[list[int]]"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "matrix", min_rows = 0, max_rows = 20, min_cols = 2, max_cols = 2, min = 0, max = 50 },
  { type = "matrix", min_rows = 0, max_rows = 20, min_cols = 2, max_cols = 2, min = 0, max = 50 },
]

[[samples]]
input = [[[1, 5], [2, 3]], [[1, 4], [1, 1], [3, 9]]]
expected = 1

[[samples]]
input = [[[4, 2]], [[4, 2], [4, 0]]]
expected = 1

[[samples]]
input = [[[7, 1]], [[8, 1]]]
expected = 0
