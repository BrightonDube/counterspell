slug = "toll-hop"
title = "The Toll Hop"
status = "published"
difficulty = "medium"
track = "matrices"
concepts = ["graphs", "heaps", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "hop_toll"
returns = "int"
comparator = "exact"
complexity_note = "State-expanded Dijkstra over (node, hops)."

[[params]]
name = "edges"
type = "list[list[int]]"
[[params]]
name = "weights"
type = "list[int]"
[[params]]
name = "n"
type = "int"
[[params]]
name = "k"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "matrix", min_rows = 0, max_rows = 24, min_cols = 2, max_cols = 2, min = 0, max = 8 }, { type = "int_array", min_len = 0, max_len = 24, min = 0, max = 100000 }, { type = "int", min = 0, max = 8 }, { type = "int", min = 0, max = 8 },
]

[[samples]]
input = [[[0, 1], [1, 2]], [5, 7], 3, 2]
expected = 12

[[samples]]
input = [[[0, 1], [1, 2]], [5, 7], 3, 1]
expected = -1

[[samples]]
input = [[[0, 1], [1, 2], [0, 2]], [1, 1, 50], 3, 1]
expected = 50
