slug = "ebb-road"
title = "The Ebb Road"
status = "published"
difficulty = "hard"
track = "matrices"
concepts = ["graphs", "edge-cases", "recursion"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "ebb_toll"
returns = "int"
comparator = "exact"
complexity_note = "O(n × arcs) relaxations plus a ring-marking pass."

[[params]]
name = "edges"
type = "list[list[int]]"
[[params]]
name = "weights"
type = "list[int]"
[[params]]
name = "n"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "matrix", min_rows = 0, max_rows = 24, min_cols = 2, max_cols = 2, min = 0, max = 8 }, { type = "int_array", min_len = 0, max_len = 24, min = -100000, max = 100000 }, { type = "int", min = 0, max = 8 },
]

[[samples]]
input = [[[0, 1], [1, 2]], [5, -7], 3]
expected = -2

[[samples]]
input = [[[1, 2]], [3], 3]
expected = -1

[[samples]]
input = [[[0, 1], [1, 1], [1, 2]], [5, -4, 3], 3]
expected = -1000000000000000
