slug = "stale-tally"
title = "The Stale Tally"
status = "published"
difficulty = "easy"
track = "arrays"
concepts = ["counting", "edge-cases", "heaps"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "stale_count"
returns = "int"
comparator = "exact"
complexity_note = "O(n) zipped scan with O(1) space."

[[params]]
name = "seen"
type = "list[int]"
[[params]]
name = "queued"
type = "list[int]"

[limits]
time_ms = 2000
