[input_schema]
type = "tuple"
items = [
  { type = "int_array", min_len = 0, max_len = 40, min = 0, max = 99 }, { type = "int_array", min_len = 0, max_len = 40, min = 0, max = 99 },
]

[[samples]]
input = [[1, 2, 3], [1, 5, 3]]
expected = 1

[[samples]]
input = [[1, 1, 1], [1, 1, 1]]
expected = 0

[[samples]]
input = [[], []]
expected = 0
