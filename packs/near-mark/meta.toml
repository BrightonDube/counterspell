slug = "near-mark"
title = "The Near Mark"
status = "published"
difficulty = "easy"
track = "matrices"
concepts = ["graphs", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "near_mark"
returns = "int"
comparator = "exact"
complexity_note = "O(arcs) filtered minimum at node 0."

[[params]]
name = "edges"
type = "list[list[int]]"
[[params]]
name = "weights"
type = "list[int]"
