slug = "chain-toll"
title = "The Chain Tolls"
status = "published"
difficulty = "hard"
track = "matrices"
concepts = ["graphs", "counting", "heaps", "edge-cases"]
origin = "original"
author = "Brighton"
licence = "MIT"
pack_version = 1
function = "toll_ways"
returns = "int"
comparator = "exact"
complexity_note = "O((n + arcs) log n) Dijkstra with a count ledger."

[[params]]
name = "edges"
type = "list[list[int]]"
[[params]]
name = "weights"
type = "list[int]"
[[params]]
name = "n"
type = "int"

[limits]
time_ms = 2000
mem_mb = 256

[input_schema]
type = "tuple"
items = [
  { type = "matrix", min_rows = 0, max_rows = 24, min_cols = 2, max_cols = 2, min = 0, max = 8 }, { type = "int_array", min_len = 0, max_len = 24, min = 0, max = 100000 }, { type = "int", min = 0, max = 8 },
]

[[samples]]
input = [[[0, 1], [1, 2], [0, 2]], [5, 7, 12], 3]
expected = 2

[[samples]]
input = [[[0, 1], [0, 2], [1, 3], [2, 3]], [5, 5, 5, 5], 4]
expected = 2

[[samples]]
input = [[[0, 1], [0, 2]], [5, 5], 4]
expected = 0
